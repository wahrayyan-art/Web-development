<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My animal fact-file</title>
    <style>
        body{
            background-color: darkgreen;            
            font-family: Arial, sans-serif;
        }
        .fact-file{
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid darkgreen;
            margin: 30px;
        }
        .animal-name{
            color: forestgreen;
            font-size: 22px;
        }
        .detail{
            color: darkslategray;
        }
        .cool-fact{
            color: darkorange;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="fact-file">
        <h2 class="animal-name">Snow leopard</h2>
        <p class="detail">Type: Big cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Dear, Goat and wild sheep</p>
        <p class="fact">Cool-fact:Can leap up to 15 meters in one jump!</p>
    </div>
</body>
</html>
